# Shared runtime configuration. Supply database credentials externally.
spring.application.name=HyFloAPI
server.port=${HYFLO_PORT:8080}
server.servlet.context-path=/hyflo/api

spring.datasource.url=${HYFLO_DB_URL}
spring.datasource.username=${HYFLO_DB_USERNAME}
spring.datasource.password=${HYFLO_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
# Safe default: use the dev profile to create/update the disposable schema.
spring.jpa.hibernate.ddl-auto=validate
# Preserve explicitly assigned historical uppercase table, column and constraint identifiers.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Persistent LOCAL identity; servlet startup requires an external base64 signing key.
# Non-web bootstrap does not instantiate the token or HTTP security components.
hyflo.identity.jwt-key=${HYFLO_JWT_KEY:}
hyflo.identity.access-seconds=${HYFLO_ACCESS_SECONDS:600}
hyflo.identity.session-seconds=${HYFLO_SESSION_SECONDS:28800}
hyflo.identity.login-window-seconds=${HYFLO_LOGIN_WINDOW_SECONDS:60}
hyflo.identity.login-global-limit=${HYFLO_LOGIN_GLOBAL_LIMIT:120}
hyflo.identity.login-ip-limit=${HYFLO_LOGIN_IP_LIMIT:20}
hyflo.identity.login-username-limit=${HYFLO_LOGIN_USERNAME_LIMIT:10}
hyflo.identity.login-bucket-capacity=${HYFLO_LOGIN_BUCKET_CAPACITY:10000}
# Do not trust caller-supplied proxy/source headers for the login limiter.
server.forward-headers-strategy=none

# Expose only reviewed actuator surfaces; retain Spring Security's default protection.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=dz.sh.hyflo

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
logging.level.dz.sh.hyflo=INFO
server.error.include-stacktrace=never
server.error.include-message=never
