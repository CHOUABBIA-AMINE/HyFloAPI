# Shared runtime configuration. Supply database credentials externally.
spring.application.name=HyFloAPI
server.port=${HYFLO_PORT:8080}
server.servlet.context-path=/hyflo/api

spring.datasource.url=${HYFLO_DB_URL}
spring.datasource.username=${HYFLO_DB_USERNAME}
spring.datasource.password=${HYFLO_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
# Safe default: use the dev profile to create/update the disposable schema.
spring.jpa.hibernate.ddl-auto=validate
# Preserve explicitly assigned historical uppercase table, column and constraint identifiers.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Local Spring Security baseline; no external identity provider is configured.
# Replace the default user mechanism only when the real identity module is restored.
spring.security.user.name=${HYFLO_LOCAL_USERNAME:user}
spring.security.user.password=${HYFLO_LOCAL_PASSWORD}

# Expose only reviewed actuator surfaces; retain Spring Security's default protection.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=dz.sh.hyflo

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
logging.level.dz.sh.hyflo=INFO
server.error.include-stacktrace=never
server.error.include-message=never
